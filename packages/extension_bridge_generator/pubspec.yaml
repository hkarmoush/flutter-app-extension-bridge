name: extension_bridge_generator
description: AST-driven Dart & Swift 6 Package code generator, Xcode project doctor, and live Simulator inspector CLI for extension_bridge.
version: 0.1.0
repository: https://github.com/hkarmoush/flutter-app-extension-bridge
issue_tracker: https://github.com/hkarmoush/flutter-app-extension-bridge/issues
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  analyzer: ">=6.5.0 <11.0.0"
  args: ^2.6.0
  extension_bridge: ^0.1.0
  extension_bridge_annotation: ^0.1.0
  meta: ^1.15.0
  path: ^1.9.0
  source_span: ^1.10.0

dev_dependencies:
  test: ^1.25.0

executables:
  extension_bridge: extension_bridge
